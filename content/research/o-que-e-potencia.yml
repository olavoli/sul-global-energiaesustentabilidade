factChecks:
  - statement: >-
      Os verbetes NIST distinguem watt como unidade de potência/taxa de trabalho e joule
      como unidade de energia/trabalho; 1 W = 1 J/s. Confirmação limitada às definições
      acessíveis, não a leitura integral da norma referenciada pelo léxico.
    status: confirmed
    sourceUrls:
      - https://www.nist.gov/glossary-term/34606
      - https://www.nist.gov/glossary-term/26261
  - statement: >-
      O guia DOE, nas entradas kilowatt e kilowatt-hour, define kW como 1000 W e kWh
      como energia associada a 1 kW sustentado por 1 hora. Não são unidades intercambiáveis.
    status: confirmed
    sourceUrls:
      - https://www.energy.gov/cmei/communicationstandards/style-guide-full-text
  - statement: >-
      A tabela NIST B.8 fornece 1 h = 3600 s e 1 kWh = 3600000 J = 3,6 MJ.
      O ponto decimal EN em 0.5 e 3.6 preserva os valores de 0,5 e 3,6 em PT/ES.
    status: confirmed
    sourceUrls:
      - https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b8
  - statement: >-
      P média = ΔE/Δt representa a taxa média no intervalo, coerente com a definição
      de watt. E = P × t é a reorganização para potência média do mesmo intervalo
      ou potência constante; não se apresenta como regra sem condição para P instantânea variável.
      Trata-se de derivação conceitual/dimensional, não fórmula transcrita literalmente do verbete.
    status: confirmed
    sourceUrls:
      - https://www.nist.gov/glossary-term/34606
      - https://www.nist.gov/glossary-term/26261
  - statement: >-
      Os casos 1 kW × 1 h = 1 kWh e 2 kW × (30/60) h = 1 kWh são cálculos didáticos
      conferidos a partir da relação potência-tempo, não resultados de ensaio de aparelhos.
      A comparação dos elevadores é uma situação hipotética com mesma carga/altura e
      diferenças de eficiência desconsideradas; sua conclusão usa a mesma energia em menos tempo.
    status: confirmed
    sourceUrls:
      - https://www.nist.gov/glossary-term/34606
      - https://www.energy.gov/cmei/communicationstandards/style-guide-full-text
  - statement: >-
      Potência e eficiência não são sinônimos: o NIST define uma taxa de trabalho;
      o DOE exemplifica eficiência de conversão como fração convertida. O contraste
      entre motores do artigo é uma explicação condicional, não um desempenho medido
      nem uma conclusão experimental atribuída ao guia de estilo.
    status: confirmed
    sourceUrls:
      - https://www.nist.gov/glossary-term/34606
      - https://www.energy.gov/cmei/communicationstandards/style-guide-full-text
