articleSlug: o-que-e-potencia
researchQuestion: Como distinguir potência, energia e eficiência e interpretar corretamente W, kW e kWh?
scope: >-
  Briefing reconstruído retrospectivamente em 28/10/2026 a partir do artigo PT publicado,
  das quatro fontes estruturadas já documentadas e das cópias EN/ES revisadas por IA.
  Hipótese editorial reconstruída: separar quantidade de energia, taxa de transferência
  e eficiência evita interpretar maior potência como maior consumo ou maior rendimento.
  Preservar a sequência dos elevadores, potência média, aparelhos hipotéticos, kWh,
  escalas, eficiência e síntese; cinco pontos-chave, Callout, duas imagens e quatro
  referências. Não é nova versão do artigo nem prova de pesquisa/entrevista histórica.
  Escopo de unidades e conceitos universais, sem estatísticas ou comparações entre países.
  Conferência assistida documental e algébrica, não revisão linguística humana das traduções.
audience: Leitores do Sul Global interessados em energia, sem pressupor formação em física ou engenharia; edições EN e ES mantêm o mesmo público e significado.
keyQuestions:
  - O que potência média expressa em relação à energia transferida e ao intervalo de tempo?
  - Por que watt e quilowatt medem potência, enquanto joule e quilowatt-hora medem energia?
  - Em quais condições é válido usar E = P × t nos exemplos do artigo?
  - Por que 1 kW durante 1 hora e 2 kW durante 30 minutos produzem a mesma energia no exemplo?
  - Por que potência útil e eficiência não são a mesma grandeza?
  - As edições EN e ES preservam fórmulas, unidades, condições e conclusões sem alegar revisão humana integral?
requiredData:
  - Definições institucionais de watt e joule; W = J/s.
  - kW = 1000 W; 1 h = 3600 s; 1 kWh = 3600000 J = 3,6 MJ.
  - Cálculo didático de 1 kW × 1 h e 2 kW × 0,5 h, ambos iguais a 1 kWh; não são medições experimentais.
  - Separação entre potência média ou constante no intervalo e potência instantânea variável.
  - Mesmas fontes, autoria, licença declarada, imagens e significado nas versões PT, EN e ES.
requiredSourceTypes:
  - official
  - Instituições de metrologia para definições e conversões do Sistema Internacional.
  - Documentação governamental para uso de unidades e distinção kW/kWh.
