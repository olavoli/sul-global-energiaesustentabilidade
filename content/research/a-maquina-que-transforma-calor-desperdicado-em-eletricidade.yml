articleSlug: a-maquina-que-transforma-calor-desperdicado-em-eletricidade
researchQuestion: Como o ORC converte parte do calor disponível em eletricidade e quais condições determinam sua adequação?
scope: Circuito básico, seleção de fluido, balanço líquido, aplicações e limites técnicos/econômicos; sem resultados de instalações não comprovadas.
audience: Leitores do Sul Global interessados em energia, sem exigir formação em engenharia.
keyQuestions:
  - Como o circuito fechado se relaciona com o gerador?
  - Por que eficiência, temperatura e pressão dependem do projeto?
  - Quais fatores condicionam a viabilidade?
requiredData:
  - Exemplo hipotético de 1 MW térmico efetivamente aproveitado e 15% líquidos, resultando em 150 kW elétricos.
requiredSourceTypes: [official, academic]
