factChecks:
  - statement: O circuito básico contém evaporador, expansor, condensador e bomba; o gerador é acoplado mecanicamente ao expansor.
    status: confirmed
    sourceUrls: [https://orbi.uliege.be/handle/2268/138756]
  - statement: A seleção do fluido e as condições de operação são específicas do projeto, sem percentuais universais.
    status: confirmed
    sourceUrls: [https://orbi.uliege.be/handle/2268/138756]
  - statement: O R245fa tem temperatura crítica de 427,01 K; a curva de coexistência líquido-vapor não se estende acima dela.
    status: confirmed
    sourceUrls: [https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=917507]
  - statement: O limite de Carnot usa temperaturas absolutas entre reservatórios ideais; não prevê o rendimento líquido de uma instalação.
    status: confirmed
    sourceUrls: [https://openstax.org/books/university-physics-volume-2/pages/4-5-the-carnot-cycle]
  - statement: Recuperação de calor exige integração e avaliação de custos; geração geotérmica binária utiliza circuitos separados.
    status: confirmed
    sourceUrls: [https://www.energy.gov/cmei/ito/waste-heat-recovery-basics, https://www.energy.gov/hgeo/geothermal/geothermal-electricity-generation]
