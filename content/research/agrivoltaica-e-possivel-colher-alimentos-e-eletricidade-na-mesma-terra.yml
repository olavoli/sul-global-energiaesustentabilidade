# Consolidação documental da matriz existente; não declara revisão factual humana integral.
articleSlug: agrivoltaica-e-possivel-colher-alimentos-e-eletricidade-na-mesma-terra
researchQuestion: Em quais condições a agrivoltaica permite produzir alimentos e eletricidade na
  mesma área com vantagens técnicas, ambientais e econômicas?
scope: "Hipótese editorial: o uso compartilhado pode ampliar o aproveitamento da terra e
  diversificar receitas quando configuração fotovoltaica, cultivo, clima, manejo e cenário econômico
  são compatíveis. Examinar LER, microclima, água, produtividade, CAPEX e payback em contextos
  específicos; distinguir medições, modelos e exemplos. Não demonstrar superioridade universal nem
  transformar cooperação BRICS em prova de adoção tecnológica. Este briefing consolida a matriz já
  produzida; não é nova redação do artigo."
audience: Leitores do Sul Global interessados em energia solar, agricultura, sustentabilidade e uso
  da terra, sem pressupor formação técnica especializada.
keyQuestions:
  - Como o LER compara produções por unidade de área, e o que o exemplo didático 1,55 permite
    concluir?
  - Quais configurações e denominadores explicam o CAPEX adicional no benchmark do NREL?
  - Sob quais premissas o estudo de Iranduba/AM simula payback de 7 anos e 10 meses?
  - Quais efeitos microclimáticos, agrícolas e hídricos foram medidos e quais foram modelados?
  - Quais experiências internacionais são instalações, pilotos ou estudos, e qual o recorte
    histórico da participação no BRICS?
requiredData:
  - "[1] guia técnico e estimativas de custos. Evidência: Custos variam com configuração, altura e
    contexto alemão; o capítulo econômico separa CAPEX, OPEX e LCOE. Não foi confirmada uma faixa
    geral de CAPEX 20–30%. O LCOE cerca de 50% maior no arranjo elevado acima de 4 m não é CAPEX.
    Heggelbach inclui batata, trigo, aipo e trevo; respostas dependem do ano e cultivo. Localização:
    Seções 2 (configurações/projetos), 3 (agricultura), 4.1–4.4 (economia); figuras 38–40; edição na
    folha de créditos"
  - "[2] experimento de campo + simulação elétrica. Evidência: Experimento de 2017 no Arizona. Média
    diurna do ar 1,2 ± 0,3 °C inferior; média noturna 0,5 ± 0,4 °C superior. Respostas variam entre
    três culturas. Menor transpiração não equivale a igual redução de irrigação. Módulos mais frios
    são outro indicador; ganhos elétricos anuais foram simulados. Não sustenta o par ar −3 °C/solo
    −5 °C tal como atribuído no Word. Localização: Nature Sustainability 2, 848–855; Results:
    Microclimatic impacts, Crop responses, Potential impacts on PV panel performance; Methods"
  - "[3] modelo de custos bottom-up, Estados Unidos, benchmark 2020. Evidência: Figura 3, p.11:
    benchmark de 500 kW, EUA, custos instalados US$1,53/WDC (fixo convencional), US$1,66/WDC
    (tracker convencional), US$1,83/WDC (cultivos vertical), US$2,09/WDC (cultivos tracker elevado),
    US$2,33/WDC (cultivos elevado e reforçado). Acréscimo reforçado/fixo=(2,33/1,53−1)×100=52,29%,
    aproximadamente52%. Modelo de custos, não levantamento mundial. Comparações vertical/fixo≈19,61%
    e tracker elevado/tracker convencional≈25,90%; não demonstram faixa geral Fraunhofer20–30%.
    Localização: NREL/TP-6A20-77811; Executive Summary; seção 5 e figuras comparativas; seção 6, p.
    19"
  - "[4] simulação econômica de vinhedos alemães. Evidência: Cenários alemães apresentam VPL
    negativo em horizonte de 20 anos sob premissas adotadas. Não é observação de payback nem prova
    universal de inviabilidade sem subsídios. ROI é razão de retorno; prazo de retorno é payback.
    Localização: Resumo; seções 3, 4 e 5.4; tabelas de cenários"
  - "[5] síntese de pesquisa de campo. Evidência: PDF consultado; mais de25locais; não garante
    resposta positiva de toda cultura. Localização: NREL/TP-6A20-83566, agosto; Executive Summary,
    pesquisa2015–2021"
  - "[6] avaliação de potencial; escopo do resumo consultado. Evidência: Existência, título,
    periódico e DOI localizados. Resumo aborda GD, potencial e obstáculos. Não certifica números
    microclimáticos nem a coincidência espacial exata de irrigação e estresse hídrico sem conferir
    os resultados integrais. Localização: Applied Energy360,122782; metadados e resumo primário;
    desafios e potencial regional"
  - "[7] estudo técnico específico, PDF consultado. Evidência: CCampo em Santarém/PA, piloto
    instalado em2023, em operação no recorte; distinto de APOI/AM proposto. Data de publicação
    confirmada; não presumir estado de todos os projetos em2026. Localização: Expediente p.2:
    atualização junho2024, tradução março2025, publicação novembro2025; seção4.1.3,p42; tabela3,p45;
    desafios pp14–15; estudo de caso capítulo5"
  - "[8] registro oficial histórico de participação. Evidência: Lista 11 membros, incluindo Arábia
    Saudita e Indonésia, e nove parceiros naquele evento. Não inclui ainda Vietnã. Não demonstra
    adoção agrivoltaica nem fixa a composição em outubro de 2026. Localização: Participantes >
    Países Membros / Países Parceiros"
  - "[9] anúncio oficial localizado, acesso parcial. Evidência: Vietnã como décimo parceiro em junho
    de 2025; exige combinar recortes históricos e datar mapa, não tratar a lista anterior de nove
    como contradição nem inventar adesão em 2026. Localização: Anúncio de 13/06/2025 localizado em
    busca oficial; abertura integral falhou"
  - "[10] relato corporativo de instalação real. Evidência: Documenta integração produtiva descrita
    pela fornecedora; não apresenta renda provincial medida +30%. Ano não confirmado. Localização:
    Descrição Baofeng/goji e efeitos sobre trabalho local"
  - "[11] documento oficial localizado; acesso parcial. Evidência: ICAR-CAZRI Jodhpur desenvolveu
    sistema de105kW. Distinguir sistema existente das capacidades previstas no programa KUSUM. Não
    comprova pilotos de Gujarat/Karnataka ou IIT. Localização: Resposta de 09/03/2021, itens (a) e
    (b); resultado documental indexado, abertura direta falhou"
  - "[12] revisão; acesso parcial. Evidência: Menciona 20–30% de redução de consumo de água. Não
    usar como prova primária indiana, nem como demonstração do par IIT/4°C/irrigação do Word.
    Localização: Solar Energy 309, 114438; trecho indexado sobre alface e consumo de água, chamada
    [45]"
  - "[13] experimentos e modelagem; verificação parcial. Evidência: Consumo hídrico da alface 20–30%
    menor, em estudo de Lavalette/Montpellier, França. Não demonstra IIT/Índia nem vinculação a
    −4°C. A identidade literal do item [45] da revisão de 2026 não foi recuperada; correspondência
    textual identificada, não ordinal certificado. Localização: Agricultural Water Management 208,
    440–453; resumo institucional e trechos primários indexados; texto integral não recuperado"
  - "[14] modelagem regional. Evidência: Modela citros e uvas de mesa no Cabo Ocidental. Não é
    ensaio de vinícola demonstrando acidez de uvas para vinho. Proposta de substituição factual
    disponível sem converter estudo em instalação operacional. Localização: WRC TT 864/21, outubro;
    seção 3.5.3, p. 42 em diante; tabelas 3-22 e seguintes"
  - "[15] projeto proposto / simulação de viabilidade. Evidência: APOI, Iranduba/AM, quatro
    famílias. Horizonte 25 anos; TMA 13,25%; crescimento tarifário 9,2% adotado. Payback descontado
    7 anos e 10 meses no cenário de investimento integral dos agricultores. Perdas agrícolas de
    5–20% são cenários, não medições. Não comprova projeto CCampo/PA nem retorno nacional típico.
    Localização: RBENS 15(2), 131–139; p. 132 metodologia; p. 137 tabelas 5 e 6 e seção 3.4"
