factChecks:
  - statement: LER é uma soma de razões de produções por área comparadas aos sistemas separados; 0,80 +
      0,75 = 1,55 é exemplo didático, não resultado experimental nem garantia de lucro ou aumento da
      colheita.
    status: confirmed
    sourceUrls:
      - https://www.ise.fraunhofer.de/content/dam/ise/en/documents/publications/studies/APV-Guideline.pdf
      - https://www.nlr.gov/docs/fy22osti/83566.pdf
      - https://www.gov.br/mme/pt-br/assuntos/secretarias/sntep/parcerias-energeticas/publicacoes/EstudoAgriPVPT.pdf
  - statement: "NREL benchmark 2020/EUA, 500 kW: elevado reforçado US$2,33/WDC versus fixo convencional
      US$1,53/WDC resulta em cerca de 52% adicionais. É modelo de custos; não faixa mundial. Não
      manter faixa geral CAPEX 20–30% sem fonte."
    status: confirmed
    sourceUrls:
      - https://www.nlr.gov/docs/fy21osti/77811.pdf
  - statement: "Iranduba/AM, projeto proposto APOI: payback descontado simulado de 7 anos e 10 meses no
      cenário de investimento integral; horizonte 25 anos, TMA 13,25% e crescimento tarifário 9,2%
      adotados. Perdas agrícolas de 5–20% são cenários, não medições."
    status: confirmed
    sourceUrls:
      - https://rbens.emnuvens.com.br/rbens/article/download/469/326/972
  - statement: "Arizona/2017: média diurna do ar 1,2 ± 0,3 °C inferior e noturna 0,5 ± 0,4 °C superior;
      respostas agrícolas variam entre culturas. Menor transpiração não equivale a redução idêntica
      da irrigação aplicada; geração anual foi simulada."
    status: confirmed
    sourceUrls:
      - https://energy.arizona.edu/sites/default/files/2022-09/Barron-Gafford%20et%20al%20Nature%20Sustainability%202019.pdf
  - statement: Estudo francês de alface em Lavalette/Montpellier apresenta consumo hídrico 20–30% menor;
      experimentos e modelagem, conforme resumo institucional/trechos consultados. Não atribuir ao
      IIT/Índia nem associar a −4 °C. A identidade ordinal [45] da revisão não foi certificada,
      sendo usada a referência primária diretamente.
    status: confirmed
    sourceUrls:
      - https://publications.cirad.fr/une_notice.php?dk=598808
      - https://doi.org/10.1016/j.solener.2026.114438
  - statement: Produtividade, balanço hídrico e viabilidade dependem de cultura, manejo, clima e
      configuração; potencial técnico não é garantia de desempenho. A análise alemã de vinhedos é
      simulação econômica, não observação universal de payback.
    status: confirmed
    sourceUrls:
      - https://www.ise.fraunhofer.de/content/dam/ise/en/documents/publications/studies/APV-Guideline.pdf
      - https://energy.arizona.edu/sites/default/files/2022-09/Barron-Gafford%20et%20al%20Nature%20Sustainability%202019.pdf
      - https://www.frontiersin.org/journals/horticulture/articles/10.3389/fhort.2024.1473072/full
      - https://www.nlr.gov/docs/fy22osti/83566.pdf
  - statement: Baofeng/Ningxia é instalação descrita em relato corporativo Huawei; sustenta integração
      produtiva e trabalho local atribuídos à fornecedora, não aumento medido de 30% da renda de
      agricultores chineses.
    status: confirmed
    sourceUrls:
      - https://www.huawei.com/en/sustainability/the-latest/stories/smart-agrivoltaic-power-plant-in-ningxia-en
  - statement: Documento oficial indiano localizado informa sistema experimental ICAR-CAZRI de 105 kW em
      Jodhpur; não comprova os números atribuídos ao IIT. Verificação limitada ao conteúdo
      documental indexado, sem leitura integral.
    status: confirmed
    sourceUrls:
      - https://www.icar.gov.in/sites/default/files/inline-files/Annexure-IX_compressed.pdf
  - statement: WRC modela citros e uvas de mesa no Cabo Ocidental, não comprova ensaio operacional de
      vinícola sobre acidez. Potencial de Egito/EAU não equivale a instalação comercial comprovada.
    status: confirmed
    sourceUrls:
      - https://www.wrc.org.za/wp-content/uploads/mdocs/TT%20864%20final%20web.pdf
      - https://www.ise.fraunhofer.de/content/dam/ise/en/documents/publications/studies/APV-Guideline.pdf
  - statement: "CCampo/Santarém/PA: piloto instalado em 2023, em operação no recorte do estudo; não
      confundir com o projeto simulado APOI/Iranduba/AM nem extrapolar seu estado para todo 2026."
    status: confirmed
    sourceUrls:
      - https://www.gov.br/mme/pt-br/assuntos/secretarias/sntep/parcerias-energeticas/publicacoes/EstudoAgriPVPT.pdf
      - https://rbens.emnuvens.com.br/rbens/article/download/469/326/972
  - statement: "Composição BRICS é apresentada com recorte histórico de 2025: registro do Fórum
      Parlamentar e anúncio oficial de 13/06/2025 sobre Vietnã como parceiro. Não demonstra adoção
      agrivoltaica nem certifica composição atual em outubro de 2026."
    status: confirmed
    sourceUrls:
      - https://www.congressonacional.leg.br/brics/
      - https://brics.br/pt-br/noticias/vietna-torna-se-pais-parceiro-do-brics
  - statement: A avaliação de potencial brasileiro sustenta discussão regional e desafios no escopo do
      resumo consultado; não é usada para certificar números microclimáticos não lidos nos
      resultados integrais.
    status: confirmed
    sourceUrls:
      - https://www.sciencedirect.com/science/article/pii/S030626192400165X
