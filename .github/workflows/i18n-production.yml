name: I18N Production
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: sul-global-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.I18N_AUTOMATION_ENABLED == 'true' && vars.I18N_AUTOMATIC_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[i18n-auto]')
    runs-on: ubuntu-latest
    environment: i18n-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restrict deploy to translation content
        run: |
          git diff --name-only HEAD^ HEAD | while IFS= read -r path; do
            case "$path" in
              content/translations/en/*.mdx|content/translations/es/*.mdx|content/translation-evidence/en/*.json|content/translation-evidence/es/*.json|src/content/generated/translations.ts) ;;
              *) echo 'Non-translation change; refusing automatic deploy.'; exit 1 ;;
            esac
          done
      - name: Refuse a stale production commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - run: bun install --frozen-lockfile
      - run: bun run content:validate
      - run: bun run build
        env:
          VITE_APP_ENV: production
          VITE_PUBLIC_SITE_URL: https://sulglobalenergia.com.br
      - name: Official configuration, comparison, dry-run and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.I18N_PRODUCTION_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.I18N_PRODUCTION_CF_ACCOUNT_ID }}
        run: |
          bun run production:config
          bun run production:check
          bun run production:dry-run
          bun node_modules/wrangler/bin/wrangler.js deploy --config .wrangler/production.generated.json --keep-vars
      - run: bun run smoke:production
