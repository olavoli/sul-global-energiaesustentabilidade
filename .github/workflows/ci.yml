name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Offline multilingual decision simulation
        run: bun run i18n:simulate

      - name: Real-cost pilot planning (offline, no credentials)
        run: bun run i18n:pilot

      - name: Offline editorial translation policy demonstration
        run: bun run i18n:editorial --articles o-que-e-potencia --demonstrate

      - name: Upload editorial policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-editorial-policy-report
          path: test-results/i18n-editorial-policy/**/report.json
          retention-days: 14

      - name: Upload real-cost pilot plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-real-cost-pilot-plan
          path: test-results/i18n-real-cost-pilot/plan-report.json
          retention-days: 14

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-simulation-evidence
          path: test-results/i18n-simulation/
          retention-days: 14

      - name: Build
        run: bun run build

      - name: Smoke preview worker
        run: bun run smoke:preview

      - name: Smoke multilingual SSR
        run: bun run smoke:i18n

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Visual behavior and candidate captures
        run: bun run test:visual
      - name: Power article PT EN ES review captures
        run: bun run test:visual:power
      - name: Upload browser report and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art033-visual-report
          path: |
            playwright-report/
            test-results/visual/
          retention-days: 14
