  <title id="conservacao-title">A energia muda de forma, mas permanece conservada</title>
  <desc id="conservacao-desc">Uma entrada de energia alimenta um motor. A saída principal mais espessa representa movimento útil; saídas secundárias representam calor e som. Um contorno inferior indica que a energia total permanece conservada, embora as formas tenham utilidades diferentes.</desc>
