<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Conservação da energia</title>
  <desc id="desc">Diagrama de uma entrada de energia que atravessa um processo e se distribui em movimento, luz, som e calor, mantendo a energia total conservada.</desc>
  <rect width="1200" height="675" fill="#f6f8f4"/>
  <text x="600" y="88" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="40" font-weight="700">CONSERVAÇÃO DA ENERGIA</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="75" y="245" width="220" height="140" rx="24" fill="#ffffff" stroke="#166534" stroke-width="5"/>
    <text x="185" y="305" fill="#14532d" font-size="28" font-weight="700">ENTRADA</text>
    <text x="185" y="342" fill="#374151" font-size="21">energia inicial</text>
    <path d="M295 315h130" stroke="#d97706" stroke-width="8"/><path d="M410 297l30 18-30 18z" fill="#d97706"/>
    <rect x="440" y="215" width="260" height="200" rx="28" fill="#166534"/>
    <text x="570" y="305" fill="#ffffff" font-size="31" font-weight="700">PROCESSO</text>
    <text x="570" y="345" fill="#ffffff" font-size="20">transferências e</text>
    <text x="570" y="373" fill="#ffffff" font-size="20">transformações</text>
    <path d="M700 315h105" stroke="#d97706" stroke-width="8"/><path d="M790 297l30 18-30 18z" fill="#d97706"/>
    <rect x="820" y="185" width="305" height="260" rx="24" fill="#ffffff" stroke="#166534" stroke-width="5"/>
    <text x="972" y="235" fill="#14532d" font-size="27" font-weight="700">DISTRIBUIÇÃO</text>
    <text x="972" y="290" fill="#374151" font-size="23">movimento</text>
    <text x="972" y="330" fill="#374151" font-size="23">luz</text>
    <text x="972" y="370" fill="#374151" font-size="23">som</text>
    <text x="972" y="410" fill="#374151" font-size="23">calor</text>
    <rect x="280" y="515" width="640" height="75" rx="18" fill="#fff7ed" stroke="#d97706" stroke-width="4"/>
    <text x="600" y="562" fill="#9a3412" font-size="26" font-weight="700">ENERGIA TOTAL CONSERVADA</text>
  </g>
</svg>
